[workspace]
resolver = "3"
members = ["crates/garmin-connect", "crates/garmin-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/peilertsen/garmin-connector"
authors = ["Pål Eilertsen"]

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "7"
futures = "0.3"
rand = "0.10"
reqwest = { version = "0.13", features = ["json", "cookies", "form", "query"] }
rmcp = { version = "3.9", features = ["server", "transport-io", "macros"] }
rpassword = "7"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "io-std", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
wiremock = "0.6"
